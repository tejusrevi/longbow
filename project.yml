name: Longbow
options:
  bundleIdPrefix: com.tejusrevi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  LongbowCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Longbow:
    type: application
    platform: iOS
    sources:
      - LongbowApp
      - Game
      - UI
      - Services
      - path: Resources
        excludes: ["Fonts/README.md", "Fonts/*.txt", "Music/README.md"]
    dependencies:
      - package: LongbowCore
      - sdk: GameKit.framework
    entitlements:
      path: LongbowApp/Longbow.entitlements
      properties:
        com.apple.developer.game-center: true
        # Xcode signs App Store / TestFlight builds as "production" itself.
        aps-environment: development
    info:
      path: LongbowApp/Info.plist
      properties:
        CFBundleDisplayName: Longbow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Paper
          UIImageName: LaunchWall
          UIImageRespectsSafeAreaInsets: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
          - ShantellSans-Medium.ttf
          - ShantellSans-Bold.ttf
          - LuckiestGuy-Regular.ttf
        ITSAppUsesNonExemptEncryption: false
        # The hosted game server (Server/deploy), HTTPS only. The server key is
        # a client key, built into every copy of the app; it isn't a secret.
        LongbowServerHost: "longbow-duel.canadacentral.cloudapp.azure.com"
        LongbowServerKey: "lb-c2aacb958dc03c6861061e92"
        NSLocalNetworkUsageDescription: Longbow can connect to a game server on your network for testing.
        NSAppTransportSecurity:
          # Lets debug builds reach a dev server on the Mac (-serverHost). The
          # hosted server is HTTPS and needs no exception.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tejusrevi.longbow
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Ink
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z36U6RR5Z3
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # PART B: add MONETIZATION_COMPILED here in the first monetized release.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
schemes:
  Longbow:
    build:
      targets:
        Longbow: all
    run:
      config: Debug
    archive:
      config: Release
